  <body>
      <!-- 카운트다운 타이머 -->

                    <div id="canvas-container">

    <script>
        // Matter.js 모듈들
        const Engine = Matter.Engine,
              Render = Matter.Render,
              World = Matter.World,
              Bodies = Matter.Bodies,
              Body = Matter.Body,
              Events = Matter.Events,
              Mouse = Matter.Mouse,
              MouseConstraint = Matter.MouseConstraint;

        // 엔진 생성
        const engine = Engine.create();
        const world = engine.world;
        
        // 기본 중력 설정 (아래쪽으로)
        engine.world.gravity.x = 0;
        engine.world.gravity.y = 1;

        // 캔버스와 렌더러 설정
        const canvas = document.getElementById('world');
        const render = Render.create({
            canvas: canvas,
            engine: engine,
            options: {
                width: document.documentElement.clientWidth,
                height: document.documentElement.clientHeight,
                wireframes: false,
                background: 'transparent',
                showAngleIndicator: false,
                showVelocity: false
            }
        });

        // 이미지 경로들과 링크들
        const imageData = [
            { path: 'img/calendar.png', link: 'calendar-event' },
            { path: 'img/glass.png', link: 'show-popup' },
            { path: 'img/host.png', link: 'instagram://user?username=eeezeen' },
            { path: 'img/map.png', link: 'show-map-popup' },
            { path: 'img/photo.png', link: 'photos-redirect://www.icloud.com/sharedalbum/#B2I5oqs3qIi1Kwo' },
            { path: 'img/playllist.png', link: 'show-music-popup' }
        ];

        // 이미지 객체들을 저장할 배열
        let imageObjects = [];
        let loadedImages = 0;
        let isPartyStarted = false;

        // 카운트다운 함수
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            // 2025년 9월 6일 오후 7시 (19:00)
            let targetDate = new Date(2025, 8, 6, 19, 0, 0); // 월은 0부터 시작
            
            // 만약 올해 날짜가 이미 지났다면 내년으로 설정
            if (now > targetDate) {
                targetDate = new Date(currentYear + 1, 8, 6, 19, 0, 0);
            }
            
            const timeDiff = targetDate - now;
            
            if (timeDiff <= 0) {
                document.getElementById('countdown').textContent = '00:00:00';
                return;
            }
            
            const totalHours = Math.floor(timeDiff / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);
            
            // 항상 시:분:초 형태로 표시
            const countdownText = `${totalHours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            document.getElementById('countdown').textContent = countdownText;
        }

        // 카운트다운 시작
        function startCountdown() {
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        // 이미 등록된 사용자용 - 바로 파티 페이지로 이동
        function skipToParty() {
            // 사용자명을 "mate"로 설정하고 적절한 폰트 적용
            applyUsernameFontStyle('mate');
            
            // 바로 파티 페이지로 이동
            enterParty();
        }

        // Enroll 폼 팝업 표시
        function showEnrollForm() {
            document.getElementById('enrollFormPopup').style.display = 'flex';
            validateEnrollForm(); // 초기 상태 검증
        }

        // Enroll 폼 유효성 검사
        function validateEnrollForm() {
            const userName = document.getElementById('userName').value;
            const userPhone = document.getElementById('userPhone').value;
            const enrollButton = document.getElementById('enrollButton');
            
            // 조건: 이름 1글자 이상, 번호 11글자
            const isNameValid = userName.trim().length >= 1;
            const isPhoneValid = userPhone.replace(/\D/g, '').length === 11; // 숫자만 11글자
            
            if (isNameValid && isPhoneValid) {
                enrollButton.classList.add('active');
            } else {
                enrollButton.classList.remove('active');
            }
        }

        // Enroll 폼 팝업 닫기
        function closeEnrollForm() {
            document.getElementById('enrollFormPopup').style.display = 'none';
        }

        // 한글 여부 확인 함수
        function isKorean(text) {
            const koreanRegex = /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/;
            return koreanRegex.test(text);
        }

        // 사용자명에 맞는 폰트 적용
        function applyUsernameFontStyle(userName) {
            const usernameElements = document.querySelectorAll('.info h3');
            if (usernameElements.length > 1) {
                const usernameElement = usernameElements[1];
                usernameElement.textContent = userName;
                
                if (isKorean(userName)) {
                    // 한글이면 dunkel-sans-cond-rounded
                    usernameElement.style.fontFamily = '"dunkel-sans-cond-rounded", sans-serif';
                } else {
                    // 영어면 Sunflower
                    usernameElement.style.fontFamily = '"Sunflower", sans-serif';
                }
            }
        }

        // 구글 시트로 데이터 전송 (중복 방지)
        function sendToGoogleSheets(name, phone) {
            // 최신 배포 URL (중복 방지 기능 포함)
            const url = 'https://script.google.com/macros/s/AKfycbyYuD4ThJ__c4kirch1kMvday2Lsmzx8vwxhZH4xzVje5DI9_WZn3KH9ymO8HMLVkq7/exec';
            
            // GET 방식으로 간단하게 전송 (CORS 문제 해결)
            const params = new URLSearchParams({
                name: name,
                phone: phone
            });
            
            const requestUrl = `${url}?${params.toString()}`;
            
            // 단일 방법으로 전송 (중복 방지)
            // 방법 1: fetch 시도
            fetch(requestUrl, { 
                method: 'GET',
                mode: 'no-cors'
            }).then(() => {
                console.log('Data sent successfully via fetch');
            }).catch((error) => {
                console.log('Fetch failed, trying image tag method');
                
                // 방법 2: fetch 실패시에만 이미지 태그 사용
                const img = new Image();
                img.onload = function() {
                    console.log('Data sent successfully via image tag');
                };
                img.onerror = function() {
                    console.log('Data sent via image tag (response blocked but likely saved)');
                };
                img.src = requestUrl;
            });
        }

        // 제출 중복 방지 플래그
        let isSubmitting = false;

        // Enroll 폼 제출
        function submitEnrollForm() {
            const enrollButton = document.getElementById('enrollButton');
            
            // 이미 제출 중이면 중단
            if (isSubmitting) {
                console.log('Already submitting, please wait...');
                return;
            }
            
            // active 상태가 아니면 제출하지 않음
            if (!enrollButton.classList.contains('active')) {
                return;
            }
            
            // 제출 시작 - 중복 방지 플래그 설정
            isSubmitting = true;
            enrollButton.textContent = 'enrolling...';
            enrollButton.style.opacity = '0.5';
            enrollButton.style.cursor = 'not-allowed';
            
            const userName = document.getElementById('userName').value;
            const userPhone = document.getElementById('userPhone').value;
            
            console.log(`Submitting enrollment for: ${userName}, ${userPhone}`);
            
            // 구글 시트로 데이터 전송
            sendToGoogleSheets(userName, userPhone);
            
            // 사용자 이름을 파티 페이지에 반영하고 적절한 폰트 적용
            applyUsernameFontStyle(userName);
            
            // 잠시 대기 후 폼 닫고 파티 페이지로 이동
            setTimeout(() => {
                closeEnrollForm();
                enterParty();
                
                // 제출 완료 - 플래그 리셋 (다음 사용자를 위해)
                isSubmitting = false;
                enrollButton.textContent = 'enroll';
                enrollButton.style.opacity = '1';
                enrollButton.style.cursor = 'pointer';
            }, 1000);
        }

        // Enroll에서 파티 페이지로 전환
        function enterParty() {
            document.getElementById('enrollPage').style.display = 'none';
            document.getElementById('partyPage').style.display = 'block';
            document.getElementById('countdown').style.display = 'none'; // 카운트다운 숨기기
            
            if (!isPartyStarted) {
                isPartyStarted = true;
                // 파티 페이지 초기화
                initializeParty();
            }
        }

        // 자이로스코프 관련 변수들
        let gyroPermissionGranted = false;
        let gyroData = { beta: 0, gamma: 0 }; // 기본값 설정

        // 파티 페이지 초기화 함수
        function initializeParty() {
            createBoundaries();
            loadImages();
            requestGyroPermission(); // 자이로 센서 권한 요청
        }

        // 자이로 센서 권한 요청 및 초기화
        async function requestGyroPermission() {
            // 기본 중력 확보 (자이로 센서 여부와 관계없이)
            engine.world.gravity.x = 0;
            engine.world.gravity.y = 1;
            
            // iOS 13+ 에서 DeviceMotionEvent 권한 요청
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceMotionEvent.requestPermission();
                    if (permission === 'granted') {
                        gyroPermissionGranted = true;
                        initializeGyroscope();
                        console.log('자이로 센서 권한이 허용되었습니다.');
                    } else {
                        console.log('자이로 센서 권한이 거부되었습니다.');
                        gyroPermissionGranted = false;
                    }
                } catch (error) {
                    console.log('자이로 센서 권한 요청 중 오류:', error);
                    gyroPermissionGranted = false;
                }
            } 
            // Android 및 기타 브라우저에서는 바로 초기화
            else if (window.DeviceOrientationEvent) {
                gyroPermissionGranted = true;
                initializeGyroscope();
                console.log('자이로 센서를 초기화했습니다.');
            } else {
                console.log('이 기기는 자이로 센서를 지원하지 않습니다.');
                gyroPermissionGranted = false;
            }
        }

        // 자이로스코프 이벤트 리스너 설정
        function initializeGyroscope() {
            if (!gyroPermissionGranted) return;

            window.addEventListener('deviceorientation', function(event) {
                // beta: 앞뒤 기울임 (-180 ~ 180)
                // gamma: 좌우 기울임 (-90 ~ 90)
                gyroData.beta = event.beta || 0;
                gyroData.gamma = event.gamma || 0;
                
                updateGravityFromGyro();
            });
        }

        // 자이로 데이터를 바탕으로 중력 방향 업데이트
        function updateGravityFromGyro() {
            if (!engine || !gyroPermissionGranted) return;

            // 기본 중력값 (아래쪽으로)
            const baseGravityY = 1;
            const gravityMultiplier = 0.015; // 자이로 효과 강도 조절 (조금 줄임)

            // 자이로 데이터를 중력으로 변환
            // gamma (좌우 기울임)을 X축 중력으로 - 미세한 효과만
            const gravityX = (gyroData.gamma || 0) * gravityMultiplier;
            
            // beta는 기본적으로 90도 근처에서 평평한 상태
            // 기본 중력은 항상 아래쪽(+Y)으로 유지하고, 자이로는 미세 조정만
            const betaOffset = (gyroData.beta || 0) - 0; // 0도를 기준으로 계산
            const gravityY = baseGravityY + (betaOffset * gravityMultiplier * 0.5); // Y축 효과는 더 작게

            // 중력 업데이트 - Y는 항상 양수로 유지 (아래쪽으로)
            engine.world.gravity.x = gravityX;
            engine.world.gravity.y = Math.max(0.5, gravityY); // 최소 0.5로 아래쪽 중력 보장
        }

        // 팝업 함수들
        function showPopup() {
            document.getElementById('popupOverlay').style.display = 'flex';
        }

        // ICS 파일 생성 및 다운로드 함수
        function createCalendarEvent() {
            const eventTitle = "Mate🎉";
            const eventDescription = "See you at the party!";
            const eventLocation = "Sungsu-dong (TBD)";
            
            // 이벤트 시간 설정 (9월 6일 7시부터 11시까지)
            const startDate = new Date(2025, 8, 6, 19, 0, 0); // 2024년 9월 6일 오후 7시 (월은 0부터 시작)
            const endDate = new Date(2025, 8, 6, 23, 0, 0);   // 2024년 9월 6일 오후 11시
            
            // ICS 형식으로 날짜 변환
            const formatDate = (date) => {
                return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            };
            
            // ICS 파일 내용 생성
            const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Party//Party Event//EN
BEGIN:VEVENT
UID:${Date.now()}@party.com
DTSTAMP:${formatDate(new Date())}
DTSTART:${formatDate(startDate)}
DTEND:${formatDate(endDate)}
SUMMARY:${eventTitle}
DESCRIPTION:${eventDescription}
LOCATION:${eventLocation}
URL:https://www.eeezeen.com
BEGIN:VALARM
TRIGGER:-PT15M
ACTION:DISPLAY
DESCRIPTION:Reminder
END:VALARM
END:VEVENT
END:VCALENDAR`;

            // Blob 생성 및 다운로드
            const blob = new Blob([icsContent], { type: 'text/calendar' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'party-event.ics';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // 바닥과 벽 생성 (안보이게)
        function createBoundaries() {
            const actualWidth = document.documentElement.clientWidth;
            const actualHeight = document.documentElement.clientHeight;
            
            const ground = Bodies.rectangle(
                actualWidth / 2, 
                actualHeight + 50, 
                actualWidth + 200, 
                100, 
                { 
                    isStatic: true, 
                    restitution: 0.8,
                    render: { visible: false }
                }
            );
            
            const leftWall = Bodies.rectangle(
                -50, 
                actualHeight / 2, 
                100, 
                actualHeight + 200, 
                { 
                    isStatic: true, 
                    restitution: 0.8,
                    render: { visible: false }
                }
            );
            
            const rightWall = Bodies.rectangle(
                actualWidth + 50, 
                actualHeight / 2, 
                100, 
                actualHeight + 200, 
                { 
                    isStatic: true, 
                    restitution: 0.8,
                    render: { visible: false }
                }
            );

            // 상단 천장 추가 (드래그할 때 위로 못나가게, 하지만 이미지 진입은 허용)
            const ceiling = Bodies.rectangle(
                actualWidth / 2, 
                -300, 
                actualWidth + 200, 
                100, 
                { 
                    isStatic: true, 
                    restitution: 0.8,
                    render: { visible: false }
                }
            );

            World.add(world, [ground, leftWall, rightWall, ceiling]);
        }

                // 이미지 로드 및 물리 객체 생성
        function loadImages() {
            let allImagesLoaded = [];
            
            imageData.forEach((item, index) => {
                const img = new Image();
                img.onload = function() {
                    // 이미지 크기 조정 (태블릿 이상에서는 고정 크기)
                    const actualWidth = document.documentElement.clientWidth;
                    const actualHeight = document.documentElement.clientHeight;
                    
                    let scale;
                    if (actualWidth >= 768) { // 태블릿 이상 크기
                        scale = Math.min(actualWidth, actualHeight) / 1200; // 600으로 고정
                    } else { // 모바일
                        scale = Math.min(actualWidth, actualHeight) / 900; // 기존 비례
                    }
                    const width = this.naturalWidth * scale;
                    const height = this.naturalHeight * scale;
                    
                    // 이미지 정보 저장
                    allImagesLoaded[index] = {
                        item: item,
                        width: width,
                        height: height,
                        scale: scale
                    };
                    
                    loadedImages++;
                    
                    // 모든 이미지가 로드되면 동시에 생성
                    if (loadedImages === imageData.length) {
                        createAllImages(allImagesLoaded);
                        startSimulation();
                    }
                };
                img.src = item.path;
            });
        }
        
        // 모든 이미지를 동시에 생성 (브라우저 안에서 겹치지 않게)
        function createAllImages(allImagesLoaded) {
            const actualWidth = document.documentElement.clientWidth;
            const actualHeight = document.documentElement.clientHeight;
            
            const cols = Math.ceil(Math.sqrt(allImagesLoaded.length)); // 격자 열 수
            const rows = Math.ceil(allImagesLoaded.length / cols); // 격자 행 수
            
            allImagesLoaded.forEach((imageInfo, index) => {
                // 격자 위치 계산
                const col = index % cols;
                const row = Math.floor(index / cols);
                
                // 브라우저 상단 영역을 격자로 나누어 위치 계산 (화면 안에서)
                const cellWidth = actualWidth / cols;
                const cellHeight = actualHeight / (rows + 2); // 여유 공간 추가
                
                const x = (col + 0.5) * cellWidth; // 격자 중앙
                const y = (row + 0.5) * cellHeight; // 브라우저 상단부터 시작
                
                // 랜덤 회전각 (-90도 ~ 90도)
                const randomAngle = (Math.random() - 0.5) * Math.PI;
                
                // 물리 객체 생성
                const body = Bodies.rectangle(x, y, imageInfo.width, imageInfo.height, {
                    restitution: 0.6,
                    friction: 0.3,
                    frictionAir: 0.01,
                    angle: randomAngle,
                    render: {
                        sprite: {
                            texture: imageInfo.item.path,
                            xScale: imageInfo.scale,
                            yScale: imageInfo.scale
                        }
                    }
                });
                
                // 링크 정보를 body에 저장
                body.imageLink = imageInfo.item.link;
                
                imageObjects.push(body);
                World.add(world, body);
            });
        }

        // 시뮬레이션 시작
        function startSimulation() {
            // 마우스 제어 추가 (드래그 가능)
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.8,
                    render: {
                        visible: false
                    }
                }
            });
            
            World.add(world, mouseConstraint);
            
            // 드래그 상태 추적 변수들
            let mouseDownPosition = null;
            let isDragging = false;
            let mouseDownTime = 0;
            
            // 마우스 다운 이벤트
            Events.on(mouseConstraint, 'mousedown', function(event) {
                mouseDownPosition = { x: event.mouse.position.x, y: event.mouse.position.y };
                mouseDownTime = Date.now();
                isDragging = false;
            });
            
            // 마우스 업 이벤트 (클릭 감지)
            Events.on(mouseConstraint, 'mouseup', function(event) {
                if (mouseDownPosition) {
                    const currentPosition = event.mouse.position;
                    const distance = Math.sqrt(
                        Math.pow(currentPosition.x - mouseDownPosition.x, 2) + 
                        Math.pow(currentPosition.y - mouseDownPosition.y, 2)
                    );
                    const timeDiff = Date.now() - mouseDownTime;
                    
                    // 짧은 시간(300ms 이하)이고 거리가 짧으면(10px 이하) 클릭으로 판단
                    if (distance < 10 && timeDiff < 300 && !isDragging) {
                        const bodiesUnderMouse = Matter.Query.point(imageObjects, currentPosition);
                        
                                        if (bodiesUnderMouse.length > 0) {
                    const clickedBody = bodiesUnderMouse[0];
                    if (clickedBody.imageLink) {
                        // 캘린더 이벤트인 경우 특별 처리
                        if (clickedBody.imageLink === 'calendar-event') {
                            createCalendarEvent();
                        }
                        // 팝업 표시인 경우 특별 처리
                        else if (clickedBody.imageLink === 'show-popup') {
                            showPopup();
                        }
                        // 맵 팝업 표시인 경우 특별 처리
                        else if (clickedBody.imageLink === 'show-map-popup') {
                            showMapPopup();
                        }
                        // 음악 팝업 표시인 경우 특별 처리
                        else if (clickedBody.imageLink === 'show-music-popup') {
                            showMusicPopup();
                        }
                        // 인스타그램 딥링크인 경우 특별 처리
                        else if (clickedBody.imageLink.startsWith('instagram://')) {
                            const appLink = clickedBody.imageLink;
                            const webFallback = 'https://www.instagram.com/eeezeen/';
                            
                            window.location.href = appLink;
                            setTimeout(() => {
                                window.open(webFallback, '_blank');
                            }, 500);
                        }

                        // 사진 앱 딥링크인 경우 특별 처리
                        else if (clickedBody.imageLink.startsWith('photos-redirect://')) {
                            const appLink = clickedBody.imageLink;
                            const webFallback = clickedBody.imageLink.replace('photos-redirect://', 'https://');
                            
                            window.location.href = appLink;
                            setTimeout(() => {
                                window.open(webFallback, '_blank');
                            }, 500);
                        }
                        else {
                            // 일반 링크는 새 창에서 열기
                            window.open(clickedBody.imageLink, '_blank');
                        }
                    }
                }
                    }
                }
                
                mouseDownPosition = null;
                isDragging = false;
            });
            
            // 드래그 감지
            Events.on(mouseConstraint, 'mousemove', function(event) {
                if (mouseDownPosition && mouseConstraint.body) {
                    const currentPosition = event.mouse.position;
                    const distance = Math.sqrt(
                        Math.pow(currentPosition.x - mouseDownPosition.x, 2) + 
                        Math.pow(currentPosition.y - mouseDownPosition.y, 2)
                    );
                    
                    if (distance > 5) {
                        isDragging = true;
                    }
                }
            });
            
            // 렌더링 시작
            Render.run(render);
            
            // 엔진 실행
            Engine.run(engine);
        }

        // 브라우저 크기 변경 대응
        function handleResize() {
            // 실제 뷰포트 크기 사용 (모바일에서 주소창 등 고려)
            const actualWidth = document.documentElement.clientWidth;
            const actualHeight = document.documentElement.clientHeight;
            
            // 캔버스 크기 조정
            render.canvas.width = actualWidth;
            render.canvas.height = actualHeight;
            render.options.width = actualWidth;
            render.options.height = actualHeight;
            
            // 기존 경계 제거
            const allBodies = world.bodies;
            const boundaries = allBodies.filter(body => body.isStatic);
            World.remove(world, boundaries);
            
            // 새로운 경계 생성
            createBoundaries();
        }

        // 이벤트 리스너
        window.addEventListener('resize', handleResize);

        // 페이지 로드 시 카운트다운 시작
        window.addEventListener('load', startCountdown);
    </script>
